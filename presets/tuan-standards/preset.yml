schema_version: "1.0"

preset:
  id: "tuan-standards"
  name: "Tuan's Quality & Process Standards"
  version: "1.0.0"
  description: "Strict SDD workflow standards: simplicity-first, test-driven validation, Vietnamese communication support, and zero ambiguity tolerance."
  author: "Pham Dinh Anh Tuan"
  repository: "https://github.com/phamdinhanhtuan/spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "6 Nguyên tắc Kỹ thuật Cốt lõi của Phạm Đình Anh Tuấn (Tuan's 6 Engineering Principles)"
      replaces: "constitution-template"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Khởi tạo hoặc cập nhật hiến pháp dự án theo chuẩn của Tuấn"
      replaces: "speckit.constitution"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Cổng làm rõ yêu cầu không mơ hồ: Chủ động hỏi người dùng thay vì tự đoán"
      replaces: "speckit.clarify"

tags:
  - "tuan-standards"
  - "quality"
  - "vietnamese"
  - "sdd"
  - "simplicity"
